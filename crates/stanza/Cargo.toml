[package]
name = "stanza"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "stanza"
path = "src/main.rs"

[[bin]]
name = "stanza-dev"
path = "src/dev/main.rs"

[build-dependencies]
serde_json = "1"

[dependencies]
dragonbox_ecma = "0.1.12"
icu_collator = "2.4.0"
indexmap = "2.14.2"
libc = "0.2.191"
oxc_allocator = "=0.151.0"
oxc_ast = { version = "=0.151.0", features = ["serialize"] }
oxc_ast_visit = { version = "=0.151.0", features = ["serialize"] }
oxc_parser = "=0.151.0"
oxc_span = "=0.151.0"
oxc_syntax = "=0.151.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "unbounded_depth"] }
