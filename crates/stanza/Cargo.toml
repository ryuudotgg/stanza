[package]
name = "stanza"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "stanza"
path = "src/main.rs"

[[bin]]
name = "stanza-dev"
path = "src/dev/main.rs"

[build-dependencies]
serde_json = "1"

[dependencies]
dragonbox_ecma = "0.1.12"
icu_collator = { version = "=2.4.0", features = ["unstable"] }
indexmap = "2.14.2"
libc = "0.2.191"
mimalloc = "=0.1.52"
oxc_allocator = "=0.151.0"
oxc_ast = "=0.151.0"
oxc_ast_visit = "=0.151.0"
oxc_parser = { version = "=0.151.0", default-features = false }
oxc_span = "=0.151.0"
oxc_syntax = "=0.151.0"
regex-lite = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "unbounded_depth"] }
unicode-id-start = "1.5.0"

[dev-dependencies]
regex = "1.13.1"
regex-syntax = "0.8.11"
