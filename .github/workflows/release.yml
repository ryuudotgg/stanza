name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: 3
  DO_NOT_TRACK: true

jobs:
  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.match-version.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match Tag to Version
        id: match-version
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require Tag on Main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Read Commit
        id: commit
        run: echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Binaries
        run: bun run build --platform all --outdir dist

      - name: Write Checksums
        run: |
          cd dist
          shasum -a 256 stanza-* > SHA256SUMS

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  smoke-binary:
    name: Smoke Test (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            platform: darwin-arm64
          - os: ubuntu-latest
            name: Ubuntu
            platform: linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - name: Smoke Test
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          chmod +x "dist/stanza-$PLATFORM"
          if [ "$RUNNER_OS" = macOS ]; then
            codesign -v "dist/stanza-$PLATFORM"
          fi
          scripts/smoke.sh "dist/stanza-$PLATFORM"

  smoke-package:
    name: Smoke Test (npm)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Pack
        id: pack
        run: |
          tarball=$(npm pack --json | jq -r '.[0].filename')
          mkdir -p "$RUNNER_TEMP/package"
          mv "$tarball" "$RUNNER_TEMP/package/"
          echo "tarball=$RUNNER_TEMP/package/$tarball" >> "$GITHUB_OUTPUT"

      - name: Install Tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          mkdir -p "$RUNNER_TEMP/scratch"
          printf '%s\n' '{"name":"scratch","private":true}' > "$RUNNER_TEMP/scratch/package.json"
          cd "$RUNNER_TEMP/scratch"
          bun add "$TARBALL"

      - name: Smoke Test
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: scripts/smoke.sh "$RUNNER_TEMP/scratch/node_modules/.bin/stanza"

      - name: Smoke Test Without Node
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: scripts/smoke.sh --without-node "$RUNNER_TEMP/scratch/node_modules/.bin/stanza"

      - name: Smoke Test Without Bun
        run: scripts/smoke.sh --without-bun "$RUNNER_TEMP/scratch/node_modules/.bin/stanza"

      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  release:
    name: Release
    needs: [build, smoke-binary, smoke-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts dist

  publish:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: package

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: |
          flags=(--provenance --access public)

          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--tag next)
          fi

          npm publish package/*.tgz "${flags[@]}"
