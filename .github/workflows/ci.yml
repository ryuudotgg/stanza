name: CI

on:
  pull_request:
    branches: ["**"]

  push:
    branches: ["main"]

  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3
  DO_NOT_TRACK: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Code Checks
        run: bun run check

      - name: Type Checks
        run: bun run typecheck

  test-ubuntu:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: &test-env
      CARGO_INCREMENTAL: 0
    steps: &test-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Toolchain
        run: rustup toolchain install

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            fuzz/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'fuzz/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust Tests
        run: cargo test

      - name: Fuzz Targets
        if: runner.os == 'Linux'
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: cargo build --release

      - name: Self Check
        run: bun run self-check

      - name: Tests
        run: bun run test

  test-macos:
    name: Test (macOS)
    needs: [check, test-ubuntu]
    runs-on: macos-latest
    timeout-minutes: 25
    env: *test-env
    steps: *test-steps
