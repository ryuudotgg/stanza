name: Publish

on:
  push:
    branches: [main]
    paths: [.tegami/publish-lock.yaml]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 3
  DO_NOT_TRACK: true

jobs:
  pending:
    name: Check Publish Lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.lock.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Publish Lock
        id: lock
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          publish=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" = refs/heads/main ] && [ -f .tegami/publish-lock.yaml ]; then
              locked=$(git log -1 --format=%H -- .tegami/publish-lock.yaml)
              if [ "$locked" = "$GITHUB_SHA" ]; then
                publish=true
              else
                echo "::error::main has moved past the commit that set the publish lock, rerun the failed jobs of that commit's run instead"
                exit 1
              fi
            fi
          elif [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            changed=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- .tegami/publish-lock.yaml)
            if [ -n "$changed" ]; then
              publish=true
            fi
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Require Approval in npm Environment
        if: steps.lock.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! approved=$(gh api "repos/$GITHUB_REPOSITORY/environments/npm" --jq 'any(.protection_rules[]?; .type == "required_reviewers" and .prevent_self_review == false and any(.reviewers[]?; .type == "User" and .reviewer.login == "ryuudotgg"))') || [ "$approved" != true ]; then
            echo "::error::The npm environment must exist with ryuudotgg as required reviewer and prevent self review off before publishing"
            exit 1
          fi

  build:
    name: Build
    needs: pending
    if: needs.pending.outputs.publish == 'true'
    uses: ./.github/workflows/release-build.yml

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download Release Assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: Download Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: ${{ runner.temp }}/smoked

      - name: Verify Archives
        run: scripts/smoke-archives.sh dist

      - name: Match Smoke Tested Packages
        run: |
          bun scripts/packages.ts stage dist
          bun scripts/packages.ts pack "$RUNNER_TEMP/packed"
          for packed in "$RUNNER_TEMP"/packed/*.tgz; do
            name=$(basename "$packed")
            smoked="$RUNNER_TEMP/smoked/$name"
            if ! cmp -s "$smoked" "$packed"; then
              mkdir -p "$RUNNER_TEMP/diff/smoked/$name" "$RUNNER_TEMP/diff/packed/$name"
              tar -xzf "$smoked" -C "$RUNNER_TEMP/diff/smoked/$name" || true
              tar -xzf "$packed" -C "$RUNNER_TEMP/diff/packed/$name"
              diff -r "$RUNNER_TEMP/diff/smoked/$name" "$RUNNER_TEMP/diff/packed/$name" || true
              echo "::error::The $name Tegami would publish differs from the smoke tested package"
              exit 1
            fi
          done

          for smoked in "$RUNNER_TEMP"/smoked/*.tgz; do
            if [ ! -f "$RUNNER_TEMP/packed/$(basename "$smoked")" ]; then
              echo "::error::$(basename "$smoked") was smoke tested but Tegami would not publish it"
              exit 1
            fi
          done

      - name: Require npm 11.5.1
        run: |
          version=$(npm --version)
          if ! printf '%s\n' 11.5.1 "$version" | sort -V -C; then
            echo "::error::npm 11.5.1 or newer is required for publishing"
            exit 1
          fi

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: "true"
        run: node scripts/tegami.ts publish
