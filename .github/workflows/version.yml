name: Release

on:
  push:
    branches: [main]
    paths: [".tegami/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tegami-version-packages
  cancel-in-progress: false

env:
  FORCE_COLOR: 3
  DO_NOT_TRACK: true

jobs:
  pending:
    name: Check Notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="v$(jq -r .version package.json)"
            notes=$(git ls-tree --name-only HEAD -- .tegami/ | grep '\.md$' || true)
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null)" != false ]; then
              echo "$tag has no published release yet, so its Publish run is still going. The next note pushed to main versions any note it leaves."
              version=false
            elif [ -z "$notes" ]; then
              echo "No pending note in .tegami/"
              version=false
            fi
          fi

          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

  version:
    name: Version
    needs: pending
    if: github.ref == 'refs/heads/main' && needs.pending.outputs.version == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Set Git Identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Version Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/tegami.ts version

      - name: Sign Version Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="repos/$GITHUB_REPOSITORY/git/refs/heads/tegami/version-packages"
          head=$(gh api "$ref" --jq .object.sha)
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.verification.verified)" = true ]; then
            exit 0
          fi

          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head")
          if [ "$(jq '.parents | length' <<< "$commit")" != 1 ]; then
            echo "::error::Expected one version commit on tegami/version-packages, found a merge at $head"
            exit 1
          fi

          signed=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" \
            -f message="$(jq -r .message <<< "$commit")" \
            -f tree="$(jq -r .tree.sha <<< "$commit")" \
            -f "parents[]=$(jq -r '.parents[0].sha' <<< "$commit")" \
            --jq .sha)
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$signed" --jq .commit.verification.verified)" != true ]; then
            echo "::error::GitHub did not sign the recreated version commit $signed"
            exit 1
          fi

          if [ "$(gh api "$ref" --jq .object.sha)" != "$head" ]; then
            echo "::error::tegami/version-packages moved past $head while signing, press Release again"
            exit 1
          fi

          gh api --method PATCH "$ref" -f sha="$signed" -F force=true > /dev/null

      - name: Request Review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head tegami/version-packages --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            echo "::error::No open PR found for tegami/version-packages"
            exit 1
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$number/requested_reviewers" -f 'reviewers[]=ryuudotgg' > /dev/null
